[build]
command = "yarn tokens:build && yarn vite:build"
publish = "dist"

[build.environment]
NODE_VERSION = "22.14.0"
YARN_VERSION = "4.8.1"
VITE_APP_MODE = "production"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/meta.json"
  [headers.values]
    Cache-Control = "no-store"
